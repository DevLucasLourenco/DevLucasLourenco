name: GitHub Metrics

on:
  # Atualiza automaticamente todos os dias às 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Executa novamente se você alterar este workflow
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # ======================================================
          # USER
          # ======================================================

          user: DevLucasLourenco

          # ======================================================
          # OUTPUT
          # ======================================================

          filename: github-metrics.svg

          template: classic
          config_display: columns
          config_timezone: America/Sao_Paulo

          # ======================================================
          # GENERAL PROFILE STATISTICS
          # ======================================================

          base: header, activity, community, repositories

          # ======================================================
          # LANGUAGES
          # Substitui github-readme-stats top-langs
          # ======================================================

          plugin_languages: yes

          plugin_languages_limit: 8

          plugin_languages_threshold: 1%

          plugin_languages_details: percentage

          plugin_languages_skipped: |
            Python-SQL-AnaliseDeDadosComInteracaoBD
            AnaliseGraficaRandomificada
            TratamentoDePDF
            Analise-RelacoesDeTabelas
            AlliedWare
            WaveFlow

          # ======================================================
          # CONTRIBUTION CALENDAR
          # ======================================================

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ======================================================
          # FEATURED PROJECTS
          # ======================================================

          plugin_repositories: yes

          plugin_repositories_featured: DevLucasLourenco/AllWhatsPy, DevLucasLourenco/WaveFlow
